<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Smith</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 560px;
        margin: 8vh auto;
        padding: 0 1rem;
      }
      .ok {
        color: #137333;
      }
      .bad {
        color: #b3261e;
      }
      code {
        background: #f1f3f4;
        padding: 0.1em 0.4em;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <h1>Smith</h1>
    <p>Kisisel yapay zeka asistani — cekirdek ayakta.</p>
    <p>Gateway saglik: <strong id="health">kontrol ediliyor...</strong></p>
    <p>Protokol surumu: <code id="proto">-</code></p>
    <script>
      fetch('/v1/health')
        .then((r) => r.json())
        .then((j) => {
          document.getElementById('health').textContent = j.ok ? 'OK' : 'BOZUK';
          document.getElementById('health').className = j.ok ? 'ok' : 'bad';
          document.getElementById('proto').textContent = 'v' + j.protocolVersion;
        })
        .catch(() => {
          const el = document.getElementById('health');
          el.textContent = 'ULASILAMIYOR';
          el.className = 'bad';
        });
    </script>
  </body>
</html>

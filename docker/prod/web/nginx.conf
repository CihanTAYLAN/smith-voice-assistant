# Smith web nginx: statik sayfa + /v1/* -> gateway proxy (WS dahil).

# KIMLIKSIZ GIRIS UCLARI ICIN IP BASINA HIZ SINIRI. Gateway'in kendi sayaci
# (apps/gateway/src/routes/attempt-limiter.ts) nginx arkasinda yalniz bu konteynerin
# adresini gorur (X-Forwarded-For bilerek okunmaz); gercek istemci adresini yalniz
# burasi bilir, IP basina ayrim bu yuzden burada yapilir.
# Anahtar bos kalan istek sayilmaz: yalniz asagidaki yollar sinirlanir.
map $uri $smith_auth_limit_key {
  default "";
  ~^/v1/auth/ $binary_remote_addr;
  /v1/ws/ticket $binary_remote_addr;
}

# 30 istek/dk (2 sn'de 1) kalici hiz, ani 20 istek payi. Eslestirme yoklamasi
# (2 sn aralik) ve olagan giris/yenileme bu sinirin altinda kalir.
limit_req_zone $smith_auth_limit_key zone=smith_auth:10m rate=30r/m;
limit_req_status 429;

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # API + WebSocket tek kapidan. Upgrade basliklari /v1/ws el sikismasi icin sart.
  location /v1/ {
    limit_req zone=smith_auth burst=20 nodelay;

    proxy_pass http://gateway:4100;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
